name: release-skill
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: |
          mkdir -p dist
          (cd .claude/skills && zip -rq "../../dist/ricerca-giuridica-it_${GITHUB_REF_NAME}.zip" ricerca-giuridica-it -x "*.DS_Store")
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"
