name: quality
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # storia completa: serve al controllo (informativo) di crescita di
          # SKILL.md, che confronta la dimensione con quella all'ultimo tag
          fetch-depth: 0
      - name: Verifica skill (frontmatter, eval, changelog, puntatori, cataloghi, contratto tool)
        run: python3 scripts/verifica_skill.py
      - name: Test unitari dei controlli statici
        run: python3 -m unittest discover -s tests -v
      - name: Shellcheck sugli script
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
  # scripts/verifica_fonti.sh dipende da endpoint esterni reali: non è un
  # gate di merge (rumore da rete/anti-bot). Gira a ogni push su main
  # (non su pull_request) come segnale informativo, continue-on-error.
  fonti-endpoint-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica reachability degli endpoint catalogati
        run: bash scripts/verifica_fonti.sh
        continue-on-error: true
